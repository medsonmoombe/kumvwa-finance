name: kumvwa_finance
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  intl_phone_field: ^3.2.0
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/

flutter_launcher_icons:
  image_path: "assets/brand/icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0D2C6E"
  adaptive_icon_foreground: "assets/brand/icon_foreground_1024.png"

flutter_native_splash:
  color: "#F8F9FB"
  # Mark + "Kumvwa Finance" wordmark (iOS / Android < 12).
  image: "assets/brand/splash_logo.png"
  # Android 12+ masks the splash icon to a circle and crops everything
  # outside it — so this variant ships the mark only, already circular.
  android_12:
    color: "#F8F9FB"
    image: "assets/brand/splash_mark.png"
