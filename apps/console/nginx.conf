# Serves the built console on 5173 (same port as `vite dev`, so CORS_ORIGINS
# and APP_BASE_URL stay identical between local dev and the container stack).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router owns the URL space: unknown paths must reach index.html or
    # a hard refresh on /reports 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
