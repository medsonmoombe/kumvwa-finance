databases:
  - name: kumvwa-db
    databaseName: kumvwa
    user: kumvwa
    plan: free

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: kumvwa-redis
    plan: free
    ipAllowList: []

  # ── API (NestJS) ───────────────────────────────────────────────────────────
  - type: web
    name: kumvwa-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: kumvwa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kumvwa-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NRC_HMAC_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: OTP_DEV_MODE
        value: false
      # TEMPORARY: console sign-in is credentials-only (no OTP screen).
      # Flip to 'enabled' to restore console 2FA.
      - key: CONSOLE_OTP_FLOW
        value: disabled
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Prod MUST use the S3 driver: a Render web service has no persistent
      # disk, and the 'local' driver defaults to writing ./docs on the
      # instance AND to minting presigned URLs from API_PUBLIC_URL (which
      # defaults to http://localhost:8080 — unreachable for real clients).
      - key: STORAGE_DRIVER
        value: s3
      - key: API_PUBLIC_URL
        value: https://kumvwa-api.onrender.com/api/v1
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: kumvwa-documents
      - key: REQUEST_MIN_KWACHA
        value: 100
      - key: REQUEST_MAX_TERM
        value: 12
      - key: CREDIT_LIMIT_NO_HISTORY_KWACHA
        value: 1000
      - key: ROLLOVER_MAX
        value: 2
      - key: DEV_AUTO_VERIFY_TENANTS
        value: false


