name: kumvwa-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kumvwa
      POSTGRES_PASSWORD: kumvwa_dev
      POSTGRES_DB: kumvwa
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumvwa -d kumvwa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kumvwa-dev
      MINIO_ROOT_PASSWORD: kumvwa-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
